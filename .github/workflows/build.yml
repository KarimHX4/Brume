name: Compiler l'APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk brume.apk
      - uses: actions/upload-artifact@v4
        with:
          name: brume-apk
          path: brume.apk
      # Lien de téléchargement direct, à ouvrir depuis le téléphone :
      # https://github.com/<toi>/brume/releases/latest/download/brume.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Brume (dernière version)
          make_latest: true
          files: brume.apk
